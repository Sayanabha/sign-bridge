<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0A0A0F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>SignBridge — Live View</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0A0A0F;
      --surface: #111118;
      --panel:   #1A1A24;
      --border:  #2A2A38;
      --text:    #E8E6FF;
      --muted:   #6B6B8A;
      --accent:  #7C6AF7;
      --glow:    #A89BFA;
      --live:    #22C55E;
      --sign:    #22C55E;   /* deaf person output color */
      --speech:  #7C6AF7;   /* hearing person caption color */
      --danger:  #EF4444;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Fraunces', Georgia, serif; overflow: hidden; }

    #app { height: 100dvh; display: flex; flex-direction: column; }

    /* ── Header ── */
    #header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 18px; border-bottom: 1px solid var(--border);
      background: var(--surface); flex-shrink: 0;
    }
    #logo { font-size: 12px; font-weight: 700; color: var(--text); font-family: 'DM Mono', monospace; letter-spacing: 1px; }
    #badges { display: flex; gap: 8px; align-items: center; }
    .badge {
      display: none; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px; font-size: 10px;
      font-family: 'DM Mono', monospace;
    }
    .badge.visible { display: flex; }
    .badge-live { background: rgba(124,106,247,0.15); color: var(--speech); border: 1px solid rgba(124,106,247,0.4); }
    .badge-sign { background: rgba(34,197,94,0.15); color: var(--sign); border: 1px solid rgba(34,197,94,0.4); }
    .dot { width: 6px; height: 6px; border-radius: 50%; animation: pulse 1.4s infinite; }
    .dot-speech { background: var(--speech); }
    .dot-sign   { background: var(--sign); }

    /* ── Connecting ── */
    #connecting { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
    #connecting.hidden { display: none; }
    .spinner { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }

    /* ── Content ── */
    #content { flex: 1; display: none; flex-direction: column; overflow: hidden; }
    #content.visible { display: flex; }

    /* ── Tab bar ── */
    #tabs {
      display: flex; flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .tab {
      flex: 1; padding: 10px; text-align: center;
      font-size: 11px; font-weight: 700; font-family: 'DM Mono', monospace;
      color: var(--muted); cursor: pointer; border: none;
      background: transparent; border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .tab.active-speech { color: var(--speech); border-bottom-color: var(--speech); }
    .tab.active-sign   { color: var(--sign);   border-bottom-color: var(--sign); }

    /* ── Panels ── */
    .panel { display: none; flex: 1; overflow-y: auto; padding: 16px; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
    .panel.visible { display: flex; }

    /* ── Waiting ── */
    #waiting-speech, #waiting-sign {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; gap: 16px; color: var(--muted);
      text-align: center; padding: 40px;
    }
    .waiting-icon { font-size: 40px; animation: float 3s ease-in-out infinite; }
    .waiting-text { font-size: 14px; line-height: 1.7; }

    /* ── Caption entries ── */
    .caption-entry {
      border-radius: 12px; padding: 12px 16px;
      border: 1px solid var(--border);
      animation: slideIn 0.3s ease;
    }
    .caption-entry.speech-entry { background: rgba(124,106,247,0.08); border-color: rgba(124,106,247,0.2); }
    .caption-entry.sign-entry   { background: rgba(34,197,94,0.08);   border-color: rgba(34,197,94,0.2); }
    .caption-entry.latest-speech { border-color: rgba(124,106,247,0.5); }
    .caption-entry.latest-sign   { border-color: rgba(34,197,94,0.5); }

    .caption-text { font-size: 17px; line-height: 1.65; font-weight: 300; }
    .caption-meta { display: flex; gap: 8px; margin-top: 5px; align-items: center; }
    .caption-time { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; }
    .caption-from { font-size: 9px; font-family: 'DM Mono', monospace; }
    .from-speech { color: var(--speech); }
    .from-sign   { color: var(--sign); }

    /* ── Unified feed (shows both streams) ── */
    #unified-panel { display: none; flex: 1; overflow-y: auto; padding: 16px; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
    #unified-panel.visible { display: flex; }

    /* ── Sign token strip ── */
    #sign-strip {
      padding: 10px 16px; border-top: 1px solid var(--border);
      background: var(--surface); flex-shrink: 0;
      overflow-x: auto; display: flex; gap: 8px; align-items: center;
      -webkit-overflow-scrolling: touch;
    }
    .sign-strip-label { font-size: 9px; color: var(--muted); font-family: 'DM Mono', monospace; white-space: nowrap; flex-shrink: 0; }
    .sign-token { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-family: 'DM Mono', monospace; white-space: nowrap; flex-shrink: 0; animation: tokenPop 0.2s ease; }
    .sign-token.known    { background: rgba(124,106,247,0.2); color: var(--glow); border: 1px solid rgba(124,106,247,0.4); }
    .sign-token.fallback { background: rgba(107,107,138,0.15); color: var(--muted); border: 1px solid var(--border); }

    #coverage-bar { height: 2px; background: var(--border); flex-shrink: 0; }
    #coverage-fill { height: 100%; background: var(--accent); transition: width 0.8s ease; width: 0%; }

    /* ── Animations ── */
    @keyframes pulse   { 0%,100%{opacity:1}50%{opacity:0.4} }
    @keyframes spin    { to{transform:rotate(360deg)} }
    @keyframes float   { 0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)} }
    @keyframes slideIn { from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)} }
    @keyframes tokenPop{ from{opacity:0;transform:scale(0.85)}to{opacity:1;transform:scale(1)} }

    /* Scrollbars */
    .panel::-webkit-scrollbar, #unified-panel::-webkit-scrollbar { width: 3px; }
    .panel::-webkit-scrollbar-thumb, #unified-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    #sign-strip::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div id="header">
    <span id="logo">SIGNBRIDGE</span>
    <div id="badges">
      <div id="badge-speech" class="badge badge-live">
        <div class="dot dot-speech"></div>
        <span>SPEECH LIVE</span>
      </div>
      <div id="badge-sign" class="badge badge-sign">
        <div class="dot dot-sign"></div>
        <span>SIGNING LIVE</span>
      </div>
    </div>
  </div>

  <!-- Connecting -->
  <div id="connecting">
    <div class="spinner"></div>
    <span style="font-size:13px;color:var(--muted);font-family:'DM Mono',monospace">Connecting...</span>
  </div>

  <!-- Content -->
  <div id="content">

    <!-- Tab bar -->
    <div id="tabs">
      <button class="tab active-speech" onclick="switchTab('all')"   id="tab-all">All</button>
      <button class="tab"               onclick="switchTab('speech')" id="tab-speech">Speech → Sign</button>
      <button class="tab"               onclick="switchTab('sign')"   id="tab-sign">Sign → Text</button>
    </div>

    <!-- Unified feed (All tab) -->
    <div id="unified-panel" class="visible"></div>

    <!-- Speech captions panel -->
    <div id="speech-panel" class="panel"></div>

    <!-- Sign output panel -->
    <div id="sign-panel" class="panel"></div>

    <!-- Coverage bar -->
    <div id="coverage-bar"><div id="coverage-fill"></div></div>

    <!-- Sign token strip (speech→sign only) -->
    <div id="sign-strip">
      <span class="sign-strip-label">SIGNS</span>
    </div>

  </div>
</div>

<script>
  const serverUrl = window.location.protocol + '//' + window.location.hostname + ':3001';
  const socket = io(serverUrl, { transports: ['websocket', 'polling'] });

  let currentTab = 'all';
  let speechCount = 0;
  let signCount = 0;

  const $ = id => document.getElementById(id);

  // ── Connection ────────────────────────────────────────────────────────────
  socket.on('connect', () => {
    $('connecting').classList.add('hidden');
    $('content').classList.add('visible');
    socket.emit('viewer-join');
  });

  socket.on('disconnect', () => {
    $('badge-speech').classList.remove('visible');
    $('badge-sign').classList.remove('visible');
  });

  // ── Speech captions ───────────────────────────────────────────────────────
  socket.on('caption', entry => {
    $('badge-speech').classList.add('visible');
    addEntry('speech', entry.text, entry.timestamp, false);
  });

  socket.on('caption-update', entry => {
    // Update last speech entry with cleaned version
    const panels = ['speech-panel', 'unified-panel'];
    panels.forEach(pid => {
      const entries = $(pid).querySelectorAll('.speech-entry');
      if (entries.length > 0) {
        entries[entries.length - 1].querySelector('.caption-text').textContent = entry.text;
      }
    });
  });

  socket.on('signs', data => {
    updateSignStrip(data.signQueue || []);
    $('coverage-fill').style.width = `${data.coverage || 0}%`;
  });

  // ── Deaf person sign output ───────────────────────────────────────────────
  socket.on('sign-output', data => {
    $('badge-sign').classList.add('visible');
    addEntry('sign', data.text, data.timestamp, true);
  });

  // ── Tab switching ─────────────────────────────────────────────────────────
  function switchTab(tab) {
    currentTab = tab;

    // Hide all
    $('unified-panel').classList.remove('visible');
    $('speech-panel').classList.remove('visible');
    $('sign-panel').classList.remove('visible');

    // Remove active from all tabs
    ['all', 'speech', 'sign'].forEach(t => {
      const btn = $(`tab-${t}`);
      btn.classList.remove('active-speech', 'active-sign');
    });

    if (tab === 'all') {
      $('unified-panel').classList.add('visible');
      $('tab-all').classList.add('active-speech');
    } else if (tab === 'speech') {
      $('speech-panel').classList.add('visible');
      $('tab-speech').classList.add('active-speech');
    } else {
      $('sign-panel').classList.add('visible');
      $('tab-sign').classList.add('active-sign');
    }

    // Show/hide sign strip
    $('sign-strip').style.display = tab === 'sign' ? 'none' : 'flex';
    $('coverage-bar').style.display = tab === 'sign' ? 'none' : 'block';
  }

  // ── Add entry to panels ───────────────────────────────────────────────────
  function addEntry(type, text, timestamp, isSign) {
    const isSpeech = !isSign;

    // Remove 'latest' class from same-type entries
    const selector = isSpeech ? '.latest-speech' : '.latest-sign';
    document.querySelectorAll(selector).forEach(el => el.classList.remove('latest-speech', 'latest-sign'));

    const entryClass = isSpeech ? 'speech-entry' : 'sign-entry';
    const latestClass = isSpeech ? 'latest-speech' : 'latest-sign';
    const fromClass = isSpeech ? 'from-speech' : 'from-sign';
    const fromLabel = isSpeech ? 'Hearing' : 'Deaf';

    const html = `
      <div class="caption-entry ${entryClass} ${latestClass}">
        <p class="caption-text">${text}</p>
        <div class="caption-meta">
          <span class="caption-time">${new Date(timestamp || Date.now()).toLocaleTimeString()}</span>
          <span class="caption-from ${fromClass}">${fromLabel}</span>
        </div>
      </div>
    `;

    // Add to unified panel
    const unified = $('unified-panel');
    unified.insertAdjacentHTML('beforeend', html);
    unified.scrollTop = unified.scrollHeight;
    trimPanel(unified, 30);

    // Add to specific panel
    const specificPanel = isSpeech ? $('speech-panel') : $('sign-panel');
    specificPanel.insertAdjacentHTML('beforeend', html.replace(latestClass, latestClass));
    specificPanel.scrollTop = specificPanel.scrollHeight;
    trimPanel(specificPanel, 20);
  }

  function trimPanel(panel, max) {
    const entries = panel.querySelectorAll('.caption-entry');
    if (entries.length > max) entries[0].remove();
  }

  function updateSignStrip(signQueue) {
    const strip = $('sign-strip');
    const label = strip.querySelector('.sign-strip-label');
    strip.innerHTML = '';
    strip.appendChild(label);
    signQueue.slice(0, 12).forEach(s => {
      const span = document.createElement('span');
      span.className = `sign-token ${s.hasVideo ? 'known' : 'fallback'}`;
      span.textContent = (s.token || '').toUpperCase();
      strip.appendChild(span);
    });
  }
</script>
</body>
</html>
